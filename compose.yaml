name: sentinel
services:
  sentinel:
    image: sentinel:local
    build: .
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      DATABASE_PATH: /data/sentinel.sqlite
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - sentinel-data:/data
    restart: unless-stopped
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "node", "dist/server/container-health.js"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
volumes:
  sentinel-data:
    name: sentinel-data
